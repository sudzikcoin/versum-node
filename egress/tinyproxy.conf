Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 32
# every CONNECT / request is logged with its host: the owner's record of where a job went
LogLevel Connect
DisableViaHeader Yes
ConnectPort 443
ConnectPort 80
# deny list (FilterDefaultDeny No = the file names what is BLOCKED): the LAN, loopback, link-local, metadata
Filter "/etc/tinyproxy/deny.txt"
FilterDefaultDeny No
FilterExtended Yes
FilterCaseSensitive No
